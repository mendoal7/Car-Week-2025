<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple-Style Fullscreen Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="gallery-wrapper">
        <header class="gallery-header">
            <div class="header-info">
                <h1>Car Week 2025</h1>
                <p>An asymmetrical layout concept inspired by Apple ios Photos</p>
            </div>
            <div class="filter-controls">
                <span class="filter-btn active">All Photos</span>
                <span class="filter-btn">Favorites</span>
                <span class="filter-btn">Albums</span>
            </div>
        </header>

        <main class="photos-grid">
            <div class="photo-item featured">
                <img src="images/pebble-concours.jpg" alt="Featured Space">
                <div class="card-label">✨The Main Event 2025</div>
            </div>



            <div class="photo-item">
                <img src="images/bugatti-blue.jpg" alt="Gallery Image">
            </div>
            <div class="photo-item">
                <img src="images/vett-ghost.jpg" alt="Gallery Image">
            </div>
            <div class="photo-item">
                <img src="images/gt-super.jpg" alt="Gallery Image">
            </div>


            <div class="photo-item panoramic">
                <img src="images/panoramic-cars.jpg" alt="Panoramic View">
                <div class="card-label">Classic Collection</div>
            </div>

            <div class="photo-item">
                <img src="images/green-gt911.jpg" alt="Gallery Image">
            </div>
            <div class="photo-item">
                <img src="images/porsche-singer.jpg" alt="Gallery Image">
            </div>
            <div class="photo-item">
                <img src="images/matte-blu.jpg" alt="Gallery Image">
            </div>
            <div class="photo-item">
                <img src="images/shelby4.jpg" alt="Gallery Image">
            </div>


        </main>

    </section>

</body>

</html>
